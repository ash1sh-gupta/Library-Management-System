<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Members')}"></head>
<body>
    <div class="container-fluid">
        <div class="row g-0">
            <div th:replace="~{fragments :: sidebar('members')}"></div>
            
            <main class="col-md-9 col-lg-10 main-content">
                <div th:replace="~{fragments :: topnav}"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Manage Members</h2>
                    <a th:href="@{/members/add}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Member</a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card mb-4 border-0 shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/members}" method="get" class="d-flex">
                            <input type="text" name="q" class="form-control me-2" placeholder="Search members by name or email..." th:value="${query}">
                            <button class="btn btn-outline-primary" type="submit">Search</button>
                            <a th:href="@{/members}" class="btn btn-outline-secondary ms-2" th:if="${query != null}">Clear</a>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="member : ${members}">
                                <td th:text="${member.id}"></td>
                                <td th:text="${member.name}" class="fw-bold"></td>
                                <td th:text="${member.email}"></td>
                                <td th:text="${member.phone}"></td>
                                <td>
                                    <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-sm btn-outline-info"><i class="fas fa-edit"></i></a>
                                    <a th:href="@{/members/delete/{id}(id=${member.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this member?');"><i class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${members.empty}">
                                <td colspan="5" class="text-center">No members found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
