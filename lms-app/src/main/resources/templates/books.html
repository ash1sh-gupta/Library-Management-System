<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Books')}"></head>
<body>
    <div class="container-fluid">
        <div class="row g-0">
            <div th:replace="~{fragments :: sidebar('books')}"></div>
            
            <main class="col-md-9 col-lg-10 main-content">
                <div th:replace="~{fragments :: topnav}"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Manage Books</h2>
                    <a th:href="@{/books/add}" class="btn btn-primary"><i class="fas fa-plus"></i> Add Book</a>
                </div>

                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${message}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card mb-4 border-0 shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/books}" method="get" class="d-flex">
                            <input type="text" name="q" class="form-control me-2" placeholder="Search books by title, author, isbn..." th:value="${query}">
                            <button class="btn btn-outline-primary" type="submit">Search</button>
                            <a th:href="@{/books}" class="btn btn-outline-secondary ms-2" th:if="${query != null}">Clear</a>
                        </form>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Total Qty</th>
                                <th>Available Qty</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book : ${books}">
                                <td th:text="${book.id}"></td>
                                <td th:text="${book.title}" class="fw-bold text-primary"></td>
                                <td th:text="${book.author}"></td>
                                <td th:text="${book.isbn}"></td>
                                <td th:text="${book.totalQuantity}"></td>
                                <td>
                                    <span class="badge rounded-pill" th:classappend="${book.availableQuantity > 0} ? 'bg-success' : 'bg-danger'"
                                          th:text="${book.availableQuantity}"></span>
                                </td>
                                <td>
                                    <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-outline-info"><i class="fas fa-edit"></i></a>
                                    <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this book?');"><i class="fas fa-trash"></i></a>
                                </td>
                            </tr>
                            <tr th:if="${books.empty}">
                                <td colspan="7" class="text-center">No books found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
