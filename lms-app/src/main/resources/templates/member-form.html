<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${member.id == null ? 'Add Member' : 'Edit Member'})}"></head>
<body>
    <div class="container-fluid">
        <div class="row g-0">
            <div th:replace="~{fragments :: sidebar('members')}"></div>
            
            <main class="col-md-9 col-lg-10 main-content">
                <div th:replace="~{fragments :: topnav}"></div>
                
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 th:text="${member.id == null ? 'Add New Member' : 'Edit Member'}">Member</h2>
                    <a th:href="@{/members}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to List</a>
                </div>

                <div class="card border-0 shadow-sm" style="max-width: 600px;">
                    <div class="card-body p-4">
                        <form th:action="@{/members/save}" th:object="${member}" method="post">
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}">
                            </div>
                            
                            <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save"></i> Save Member</button>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
